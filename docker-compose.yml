services:
  tex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tex-ai
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      - NODE_ENV=production
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - ACCESS_TOKEN=${ACCESS_TOKEN:-Tex#Sec2026!Global_DemoKey}
      - AUTH_SECRET=${AUTH_SECRET:-your-random-hmac-sha256-signing-secret}
      - PORT=3050
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3050/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
