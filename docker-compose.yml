services:
  tex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tex-ai
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5-5}
      - RAG_FAST_MODEL=${RAG_FAST_MODEL:-claude-haiku-5-5}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - AUTH_SECRET=${AUTH_SECRET}
      - PORT=3050
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3050/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
