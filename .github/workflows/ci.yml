name: CI / Security Audit & Quality Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Privacy & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets or .env Files Committed
        run: |
          echo "Scanning for accidental environment or credential files..."
          if git ls-files | grep -E '^\.env(\.local|\.production|\.development)?$'; then
            echo "ERROR: Actual .env file detected in repository tracking! Aborting CI."
            exit 1
          fi
          echo "No .env files tracked. Check passed."

      - name: Audit Code Against Sensitive IP Leaks and Personal Data
        run: |
          echo "Auditing codebase against private IPs and sensitive patterns..."
          SUSPICIOUS=$(git grep -EI '100\.(106|75|117)\.|192\.168\.0\.|santinohick@|santinohickethier@' -- ':!.github' ':!.githooks' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "ERROR: Sensitive private IP or personal email pattern detected:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "Codebase clean. Zero sensitive credentials or private IP leaks detected."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run RAG Policies Audit Suite
        run: |
          python scripts/test_pipeline.py

  build-and-lint:
    name: Lint & Production Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js Standalone Production Build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          ACCESS_TOKEN: CI_TEST_TOKEN_2026
          AUTH_SECRET: ci_test_hmac_secret_32_characters_minimum
        run: npm run build

  docker-build:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tex-ai:test
